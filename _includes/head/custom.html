{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- UI font for small labels / sidebar -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Apply saved theme before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var pref = localStorage.getItem('theme') || 'light';
      var dark = pref === 'dark' ||
        (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
      else { document.documentElement.removeAttribute('data-theme'); }
    } catch (e) {}
  })();
</script>

<style>
  /* ===== Refined palette (overrides theme variables) ===== */
  :root {
    --global-bg-color: #ffffff;
    --global-text-color: #26303b;
    --global-text-color-light: #69727d;
    --global-link-color: #2563a8;
    --global-link-color-hover: #16406f;
    --global-link-color-visited: #2563a8;
    --global-border-color: #e7e9ec;
    --ink-heading: #16263a;
    --accent: #2563a8;
  }
  html[data-theme="dark"] {
    --global-bg-color: #14171c;
    --global-base-color: #14171c;
    --global-footer-bg-color: #14171c;
    --global-text-color: #e6e9ee;
    --global-text-color-light: #9aa4b0;
    --global-link-color: #7db4ec;
    --global-link-color-hover: #a9cef3;
    --global-link-color-visited: #7db4ec;
    --global-border-color: #2a2f37;
    --ink-heading: #eaf0f7;
    --accent: #7db4ec;
  }

  html, body { transition: background-color .25s ease, color .25s ease; }

  /* tighten the empty top gap left by the (absent) masthead */
  body { padding-top: 2.2em; }

  /* the homepage has an empty title - never reserve space for it */
  .page__title:empty { display: none; }
  header:empty { display: none; }

  /* ===== Content typography ===== */
  .page__content { font-size: 1.14em; line-height: 1.7; }
  .page__content > p:first-of-type { margin-top: .1em; }
  .page__content p,
  .page__content li { max-width: 42rem; }
  .page__content a {
    color: var(--global-link-color);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--global-link-color) 38%, transparent);
  }
  .page__content a:hover { color: var(--global-link-color-hover); border-bottom-color: currentColor; }

  /* section labels - small, refined, not large headings */
  .page__content h2 {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--global-text-color-light);
    margin: 1.9em 0 .75em;
    padding-bottom: .4em;
    border-bottom: 1px solid var(--global-border-color);
  }
  .page__content ul { margin: .2em 0 1em; padding-left: 1.1em; }
  .page__content li { margin-bottom: .35em; }

  /* ===== Sidebar / author profile ===== */
  .sidebar .author__name {
    font-family: "EB Garamond", Garamond, serif;
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.15;
    color: var(--ink-heading);
  }
  .author__bio {
    color: var(--global-text-color-light);
    font-size: .95rem;
    line-height: 1.4;
  }
  .author__affiliation {
    color: var(--global-text-color-light);
    font-size: .9rem;
    line-height: 1.4;
    margin: .15rem 0 0;
  }
  .author__email {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: .78rem;
    color: var(--global-text-color-light);
    margin: .65rem 0 0;
    word-break: break-word;
  }

  /* social icons - always visible, evenly spaced */
  .author__urls.social-icons-minimal {
    display: flex !important;
    flex-wrap: wrap;
    gap: 1rem;
    position: static;
    margin: .8rem 0 0;
    padding: 0;
    border: 0;
    background: none;
    box-shadow: none;
  }
  .author__urls.social-icons-minimal:before,
  .author__urls.social-icons-minimal:after { display: none; }
  .author__urls.social-icons-minimal li { margin: 0; white-space: nowrap; }
  .author__urls.social-icons-minimal a {
    margin: 0;
    padding: 0;
    font-size: 1.2rem;
    color: var(--global-text-color-light);
  }
  .author__urls.social-icons-minimal a:hover { color: var(--accent); text-decoration: none; }

  /* ===== Theme toggle button ===== */
  #theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1000;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--global-bg-color);
    color: var(--global-text-color);
    border: 1px solid var(--global-border-color);
    cursor: pointer;
    box-shadow: 0 1px 5px rgba(0, 0, 0, .08);
    transition: color .2s ease, border-color .2s ease, transform .15s ease;
  }
  #theme-toggle:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
  #theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #theme-toggle svg { width: 18px; height: 18px; display: block; }
</style>

<!-- Theme toggle: cycles Light -> Dark -> System -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var icons = {
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'
    };
    var order = ['light', 'dark', 'system'];
    var labels = { light: 'Light', dark: 'Dark', system: 'System' };
    var mq = window.matchMedia('(prefers-color-scheme: dark)');

    var btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.type = 'button';
    document.body.appendChild(btn);

    function current() { return localStorage.getItem('theme') || 'light'; }

    function apply(pref) {
      var dark = pref === 'dark' || (pref === 'system' && mq.matches);
      if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
      else { document.documentElement.removeAttribute('data-theme'); }
      btn.innerHTML = icons[pref];
      btn.title = 'Theme: ' + labels[pref] + ' (click to change)';
      btn.setAttribute('aria-label', 'Theme: ' + labels[pref] + '. Click to change.');
    }

    apply(current());

    btn.addEventListener('click', function () {
      var next = order[(order.indexOf(current()) + 1) % order.length];
      localStorage.setItem('theme', next);
      apply(next);
    });

    function onSystemChange() { if (current() === 'system') { apply('system'); } }
    if (mq.addEventListener) { mq.addEventListener('change', onSystemChange); }
    else if (mq.addListener) { mq.addListener(onSystemChange); }
  });
</script>

<!-- end custom head snippets -->
